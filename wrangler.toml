# Cloudflare Pages Configuration
# This file documents the build configuration for Cloudflare Pages
# These settings should be configured in the Cloudflare Pages dashboard

# Project name: letters (or your preferred name)
# Production branch: main
# Build command: npm run build:deploy
# Build output directory: public
#
# IMPORTANT: Ensure Git LFS is enabled for the repository
# The database file (data/newsletters.db) is stored with Git LFS
# and needs to be pulled during the build process
#
# Node version: 20 (or latest LTS)
#
# No build environment variables are required for basic deployment
# (The BUTTONDOWN_API_KEY is only needed if you run sync during build)
